server.port=8080

# Configuración H2
spring.datasource.url=jdbc:h2:mem:lucytejada_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola web y auto-creación de tablas
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Clave secreta para firmar los tokens JWT (mínimo 32 caracteres)
jwt.secret=LucyTejada-SuperSecretKey-2024-AtLeast32Chars!